apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos

metadata:
  name: network-delay-web
  namespace: chaos-mesh

spec:
  action: delay
  mode: one

  selector:
    namespaces:
      - robot-shop
    labelSelectors:
      service: web

  delay:
    latency: "1000ms"
    correlation: "100"
    jitter: "0ms"

  duration: "2m"
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos

metadata:
  name: memory-stress-web
  namespace: chaos-mesh

spec:
  mode: one

  selector:
    namespaces:
      - robot-shop
    labelSelectors:
      service: web

  stressors:
    memory:
      workers: 1
      size: "128MB"

  duration: "2m"